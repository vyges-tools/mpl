# SPDX-License-Identifier: Apache-2.0
# Build & test on every push to main and on pull requests (plus manual dispatch).
#
# ⚠️ Not the plain std-only workflow a pure-Rust crate would use: vyges-mpl reads and writes the
# design database through vyges-opendb, which statically links libodb (C++, built from source).
# So this needs the sibling checkout layout and a C++ toolchain.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    name: build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vyges-tools-mpl
    steps:
      # ⚠️ Sibling layout, so every `[patch]` path entry in Cargo.toml resolves. A patch whose
      # path does not exist is a hard `failed to load source` — Cargo does NOT fall back to the
      # git source it is patching, so a missing checkout here fails the build outright.
      # 🔑 mpl patches THREE siblings, not two: opendb, opendb-lib and loom.
      - uses: actions/checkout@v4
        with:
          path: vyges-tools-mpl
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb
          path: vyges-tools-opendb
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/opendb-lib
          path: vyges-tools-opendb-lib
      - uses: actions/checkout@v4
        with:
          repository: vyges-tools/loom
          path: vyges-tools-loom

      - name: Toolchain
        # Boost (headers) + zlib only; fmt/spdlog/abseil are built from source by libodb's build.
        # bison is for the LEF/DEF parsers.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ git bison libboost-dev libboost-iostreams-dev libbz2-dev zlib1g-dev

      - uses: dtolnay/rust-toolchain@stable

      # No --locked: Cargo.lock is gitignored here, and the [patch] resolves the sibling crates to
      # the freshly-checked-out checkouts — let Cargo resolve.
      - name: Build
        run: cargo build --release --verbose

      # ⛔ **Four test targets are EXCLUDED, and they are named rather than skipped.**
      # `tests/fixtures/counter.odb` is gitignored, and those targets open it with
      # `.expect("fixture reads")` — on a fresh clone they panic.
      #
      # ⛔ They are NOT made to skip-when-absent on purpose. A test that passes because its input
      # is missing is a test that cannot fail, which is worse than one that is openly not run.
      # Excluding them by name keeps the CI signal honest: what runs, ran.
      #
      # ℹ️ That leaves ~774 of ~918 tests. The remaining 144 are covered locally and on the
      # correlation box, where the fixture exists.
      - name: Test (fixture-independent targets)
        # ⚠️ The exclusion list is derived at run time, not hardcoded: a new test file must be
        # picked up automatically, and a hand-maintained list rots into a silently shrinking
        # suite — the same failure mode the mutation table has had twice.
        run: |
          cargo test --release --verbose --lib
          for f in tests/*.rs; do
            t=$(basename "$f" .rs)
            case "$t" in
              shaping|read_design|placement_wirelength|tree)
                echo "::notice::skipping $t — needs tests/fixtures/counter.odb, which is not tracked"
                continue ;;
            esac
            cargo test --release --verbose --test "$t"
          done

      # 🔑 The descriptor is the contract this engine publishes, and it is assembled by hand rather
      # than serialised — a stray comma makes it unparseable to the consumer it exists for. The
      # unit tests check it, but only this proves the shipped BINARY emits valid JSON.
      - name: Descriptor is valid JSON and declares its limits
        run: |
          ./target/release/vyges-mpl --describe > /tmp/describe.json
          python3 - <<'PY'
          import json
          d = json.load(open("/tmp/describe.json"))
          # ⛔ `name`, not `tool`: this descriptor is on the SHARED schema
          # (vyges-tool-descriptor/1.1), which every other engine publishes and which
          # `render-contracts.py` and `vyges mcp` read. `tool` was this engine's own key from
          # when its descriptor was ad-hoc; asserting it here is what pinned the odd shape in
          # place, and the check failed the moment the descriptor was brought into line.
          assert d["schema"] == "vyges-tool-descriptor/1.1", d.get("schema")
          assert d["name"] == "mpl", d.get("name")
          # ⛔ `maturity` is a CLOSED enum of three. An unrecognised value is not a modest claim:
          # the consumer parses it to None, treats the engine as `discovered`, and suppresses the
          # verdict to `unknown` however well-formed the assertion is.
          assert d["maturity"] in ("discovered", "structured", "workflow-validated"), d["maturity"]
          # Required: what `input_hash` does NOT cover, in the engine's own words.
          assert d["provenance_limitations"], "provenance_limitations is required"
          # ⛔ The advertised subcommand must be one main() actually dispatches. This descriptor
          # advertised `run` while `run` was unwired and exited 2, so a caller built exactly that
          # command and got a usage error.
          assert d["invocation"]["args_template"][0] == "place-macro", d["invocation"]
          # The assertion must name a field the engine emits, and pass on one value only.
          assert d["assertion"]["field"] == "status", d["assertion"]
          assert d["assertion"]["pass_when"] == {"eq": "applied"}, d["assertion"]
          # ⛔ The par limitation is part of the published contract, not a footnote: a flat cluster
          # over the level threshold is REFUSED rather than approximated. If this key ever
          # disappears, either par landed or the engine started guessing — both need a human.
          assert "par_partitioning" in d["limits"], d["limits"]
          print(f"descriptor ok; {d['name']} {d['version']}, limits: {sorted(d['limits'])}")
          PY

  lint:
    name: fmt-free lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # ⛔ NO `cargo fmt --check`. These crates are deliberately hand-formatted; `cargo fmt`
      # rewrites whole files and has produced 1100-line diffs from a 20-line edit elsewhere in
      # this tool set. Formatting is reviewed by humans, not enforced by a bot.
      - name: No machine-specific paths in tracked files
        run: |
          if git grep -nE '/home/[a-z]+/|/Users/[a-z]+/' -- . ; then
            echo "::error::a tracked file contains an absolute developer path"
            exit 1
          fi
          echo "no machine-specific paths"
