[package]
name = "vyges-mpl"
version = "0.1.46"
edition = "2021"
description = "Hierarchical macro placement over the OpenDB database: clustering, shaping, annealing, snapping."
license = "Apache-2.0"
authors = ["Vyges <https://vyges.com/contact>"]
homepage = "https://vyges.com"
repository = "https://github.com/vyges-tools/mpl"

[dependencies]
# The database is both substrate and output: mpl reads the module hierarchy, masters, track
# grids and blockages, and writes macro locations, orientations, placement status and the soft
# blockages that guard each placed macro.
# gen-write: the generated SETTERS (location, orient, placement status) are behind that feature.
vyges-opendb = { git = "https://github.com/vyges-tools/opendb.git", branch = "main", features = ["gen-write"] }
vyges-events = { git = "https://github.com/vyges-tools/events.git", branch = "main", default-features = false }
vyges-loom = { git = "https://github.com/vyges-tools/loom", branch = "main" }
serde_json = "1"
# The hypergraph partitioner that splits a large flat cluster, with its exact (ILP) stages through
# the pinned solver bundle (Linux x86_64). Without the `par` feature such a cluster is refused.
vyges-par = { git = "https://github.com/vyges-tools/par", branch = "main", optional = true }

[features]
# The command-line entry built into the library too (`cli_main`), for the suite binaries
# that link every engine and run the one they are invoked as.
suite = []
par = ["dep:vyges-par", "vyges-par/ilp"]

# Local development against the sibling checkouts. Patches are only honored from the root
# manifest, so this is a no-op for downstream consumers pulling us by git.
[patch."https://github.com/vyges-tools/opendb.git"]
vyges-opendb = { path = "../vyges-tools-opendb" }

[patch."https://github.com/vyges-tools/opendb-lib.git"]
vyges-opendb-lib = { path = "../vyges-tools-opendb-lib" }

[patch."https://github.com/vyges-tools/loom"]
vyges-loom = { path = "../vyges-tools-loom" }

[patch."https://github.com/vyges-tools/layout"]
vyges-layout = { path = "../vyges-tools-layout" }

[patch."https://github.com/vyges-tools/par"]
vyges-par = { path = "../vyges-tools-par" }

[patch."https://github.com/vyges-tools/ortools-lib"]
vyges-ortools-lib = { path = "../vyges-tools-ortools-lib" }

[[bin]]
name = "vyges-mpl"
path = "src/main.rs"

[lib]
name = "vyges_mpl"
path = "src/lib.rs"
